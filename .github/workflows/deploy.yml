name: Deploy to EC2

on:
  push:
    branches:
      - deployment   # Runs when you push to the 'deployment' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to EC2
        run: |
          ssh -tt -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e  # Exit on any command failure

            echo "$(date) - Navigating to project directory..."
            cd /home/ubuntu/myproject/meru-innovators-club-api

            echo "$(date) - Fetching latest code from deployment branch..."
            git fetch --all
            git reset --hard origin/deployment

            echo "$(date) - Activating virtual environment..."
            source /home/ubuntu/myproject/virtual/bin/activate

            echo "$(date) - Installing dependencies..."
            pip install -r requirements.txt

            echo "$(date) - Running migrations..."
            python manage.py migrate --noinput

            echo "$(date) - Collecting static files..."
            python manage.py collectstatic --noinput

            echo "$(date) - Restarting Gunicorn..."
            sudo systemctl restart gunicorn

            echo "$(date) - Deployment complete!"
          EOF
